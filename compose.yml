# Use postgres/example user/password credentials

services:
  migration_service:
    build:
      context: .
    command: ["bun", "run", "db:prepare"]
    volumes: 
      - .:/app
      - /app/node_modules
    environment: 
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:latest
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./CaddyFile:/etc/caddy/Caddyfile:ro
  api:
    depends_on:
      - gotrue
    ports:
    - 3000:3000
    build:
      context: .
    command: bun run dev --port 3000 --host 0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
  webclient:
    ports:
     - 3001:3001
    build:
      context: ./src/apps/webclient
    command: bun run dev --port 3001 --host 0.0.0.0
    volumes:
      - ./src/apps/webclient:/app
      - /app/node_modules
  db:
    image: postgres:17
    ports:
      - 5432:5432
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
     - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  gotrue:
    image: supabase/gotrue:v2.197.0
    ports: 
      - 9999:9999
    environment: 
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@db:${DATABASE_PORT}/postgres
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL}
      GOTRUE_DB_DRIVER: ${GOTRUE_DB_DRIVER}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL}
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://api:3000/templates/confirmation.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Please confirm"
      PORT: 9999
    depends_on:
      migration_service: 
        condition: service_completed_successfully
      db:
        condition: service_healthy
          
      
  mailpit: 
    image: axllent/mailpit:latest
    ports: 
      - 9000:8025
volumes:
  postgres:
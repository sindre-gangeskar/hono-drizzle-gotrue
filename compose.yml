# Use postgres/example user/password credentials

services:
  db:
    image: postgres:17
    ports:
      - 5432:5432
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
     - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}

  gotrue:
    image: supabase/gotrue:v2.197.0
    ports: 
      - 9999:9999
    environment: 
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/postgres
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL}
      GOTRUE_DB_DRIVER: ${GOTRUE_DB_DRIVER}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL}
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: "Your confirmation code is {{.Token}}"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Please confirm"
      PORT: 9999
      DB_NAMESPACE: auth

  mailpit: 
    image: axllent/mailpit:latest
    ports: 
      - 9000:8025
volumes:
  postgres: